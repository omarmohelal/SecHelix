# Illustrative fragment. Re-review pinned action commits before production use.
name: SecHelix release gate example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed repository state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Render the canonical report as redacted JSON
        run: python -m reports.report_renderer report.canonical.json --format json --output report.json
      - name: Apply the fail-closed release policy
        run: python scripts/security_gate.py report.json --policy policies/default.json --json-output
