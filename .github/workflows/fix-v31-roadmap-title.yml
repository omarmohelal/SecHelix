name: Fix V31 Roadmap Title
on:
  push:
    branches: [feat/close-v31-local-gaps]
    paths: [.github/workflows/fix-v31-roadmap-title.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Keep maturity claim honest
        shell: python
        run: |
          from pathlib import Path
          p=Path('ROADMAP.md')
          t=p.read_text(encoding='utf-8').replace('## v3.1 — expert knowledge engine and credibility program — complete','## v3.1 — expert knowledge engine and credibility program — in progress')
          p.write_text(t,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ROADMAP.md
          git commit -m 'docs: keep v3.1 maturity claim honest'
          git push origin HEAD:feat/close-v31-local-gaps
