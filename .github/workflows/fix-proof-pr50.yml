name: Fix PR50 proof transport

on:
  push:
    branches: [feat/v4-runtime-proof-execution]
    paths: [.github/workflows/fix-proof-pr50.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Harden LOCAL HTTP transport and sync portable skill
        shell: python
        run: |
          from pathlib import Path
          path = Path('sechelix_runner/proof_exec.py')
          text = path.read_text(encoding='utf-8')
          marker = 'class _CallbackHandler(BaseHTTPRequestHandler):\n'
          redirect = '''class _NoRedirect(urllib.request.HTTPRedirectHandler):\n    """Return redirect responses to the proof engine instead of following them.\n\n    The original URL has passed NetworkPolicy, but a redirect target has not.\n    Automatic redirect following would therefore turn a bounded LOCAL request\n    into an authority bypass. Callers may record the 3xx response; they must\n    build a new explicitly-authorized request to follow it.\n    """\n\n    def redirect_request(self, req, fp, code, msg, headers, newurl):  # noqa: ANN001\n        return None\n\n\n'''
          if '_NoRedirect' not in text:
              text = text.replace(marker, redirect + marker)
          old = 'with urllib.request.urlopen(request, timeout=self.timeout_seconds) as response:'
          new = 'opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), _NoRedirect())\n            with opener.open(request, timeout=self.timeout_seconds) as response:'
          if old not in text:
              raise SystemExit('expected urlopen call not found')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
      - name: Synchronize portable skill
        run: python scripts/sync_portable_skill.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sechelix_runner/proof_exec.py skills
          git commit -m 'fix: enforce network authority across proof redirects'
          git push origin HEAD:feat/v4-runtime-proof-execution
