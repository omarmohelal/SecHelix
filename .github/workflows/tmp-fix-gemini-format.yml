name: Temporary fix Gemini provider formatting

on:
  push:
    branches: [feat/gemini-cli-executor]

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Repair generated formatting
        shell: python
        run: |
          from pathlib import Path

          cli = Path('sechelix_runner/cli.py')
          text = cli.read_text(encoding='utf-8')
          start = text.index('def _build_executor(args: argparse.Namespace):')
          end = text.index('\n\ndef cmd_audit', start)
          function = '''def _build_executor(args: argparse.Namespace):
              """Select the executor. The honest default analyses nothing and says so."""
              choice = getattr(args, "executor", "none")
              if choice == "none":
                  return NullExecutor()
              if choice == "claude-code":
                  from .providers.claude_code import ClaudeCodeExecutor
                  from .providers.reasoning import ReasoningExecutor

                  provider = ClaudeCodeExecutor(model=getattr(args, "model", None))
                  if not provider.available:
                      raise RuntimeError(
                          "claude CLI not found on PATH; install Claude Code or use --executor none"
                      )
                  return ReasoningExecutor(
                      provider, timeout=float(getattr(args, "node_timeout", 300))
                  )
              if choice == "gemini-cli":
                  from .providers.gemini_cli import GeminiCliExecutor
                  from .providers.reasoning import ReasoningExecutor

                  provider = GeminiCliExecutor(model=getattr(args, "model", None))
                  if not provider.available:
                      raise RuntimeError(
                          "gemini CLI not found on PATH; install Gemini CLI or use --executor none"
                      )
                  return ReasoningExecutor(
                      provider, timeout=float(getattr(args, "node_timeout", 300))
                  )
              raise RuntimeError(f"unknown executor: {choice}")'''.replace('              ', '    ')
          cli.write_text(text[:start] + function + text[end:], encoding='utf-8')

          provider = Path('sechelix_runner/providers/gemini_cli.py')
          text = provider.read_text(encoding='utf-8')
          text = text.replace(
              '''        if not node or not entry.is_file():\n            raise ProviderError(\n      "Gemini CLI resolved to an npm batch shim, but its official Node entry "\n      "point could not be resolved safely; reinstall @google/gemini-cli"\n            )''',
              '''        if not node or not entry.is_file():\n            raise ProviderError(\n                "Gemini CLI resolved to an npm batch shim, but its official Node entry "\n                "point could not be resolved safely; reinstall @google/gemini-cli"\n            )''',
          )
          text = text.replace('    return command, env\n\ndef _parse_envelope', '    return command, env\n\n\ndef _parse_envelope')
          provider.write_text(text, encoding='utf-8')

      - name: Compile and run runner tests
        run: |
          set -euo pipefail
          python -m py_compile sechelix_runner/cli.py sechelix_runner/providers/gemini_cli.py
          python -m unittest discover -s tests/runner -p 'test_*.py' -v

      - name: Remove temporary workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-fix-gemini-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --check
          git commit -m 'Fix Gemini executor formatting and validate runner'
          git push origin HEAD:feat/gemini-cli-executor
