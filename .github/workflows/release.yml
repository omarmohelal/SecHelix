name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Build and attest SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # attest-build-provenance mints a Sigstore certificate from the OIDC token
      # and writes the resulting attestation to the repository's attestation
      # store. It needs no write access to repository contents.
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          mkdir -p dist
          # Bind the SBOM timestamp to the tagged commit so the artifact is
          # byte-reproducible from the tag alone.
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python scripts/generate_sbom.py --output dist/sechelix-sbom.cdx.json
          sha256sum dist/sechelix-sbom.cdx.json | tee dist/sechelix-sbom.cdx.json.sha256

      - name: Attest SBOM build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sechelix-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sechelix-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach SBOM to release
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only job in this workflow that can write to the repository, and the
      # only thing it does is create/update the release for the pushed tag.
      contents: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sechelix-sbom
          path: dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; attaching SBOM."
          else
            echo "Creating release ${TAG}."
            gh release create "${TAG}" --title "${TAG}" --generate-notes --verify-tag
          fi
          gh release upload "${TAG}" \
            dist/sechelix-sbom.cdx.json \
            dist/sechelix-sbom.cdx.json.sha256 \
            --clobber
          echo "::notice title=SBOM published::Verify provenance with: gh attestation verify sechelix-sbom.cdx.json --repo ${GH_REPO}"
