name: Sync Browser DOM lesson into portable skill

on:
  push:
    branches:
      - fix/browser-dom-react-url-fp
    paths:
      - .github/workflows/sync-browser-pack-portable.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Sync portable skill
        run: python scripts/sync_portable_skill.py
      - name: Validate Gold Packs
        run: python scripts/validate_gold_packs.py
      - name: Commit portable mirror
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills/sechelix/gold-packs/SEC-BROWSER-DOM-001/pack.json
          git commit -m 'sync: mirror Browser DOM false-positive lesson'
          git push origin HEAD:fix/browser-dom-react-url-fp
