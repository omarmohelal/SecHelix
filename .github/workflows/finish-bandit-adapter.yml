name: Finish Bandit adapter integration

on:
  push:
    branches:
      - feat/bandit-adapter
    paths:
      - .github/workflows/finish-bandit-adapter.yml
      - adapters/bandit.py
      - adapters/tests/fixtures/bandit.json

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Register Bandit and add contract tests
        shell: python
        run: |
          from pathlib import Path

          registry = Path('adapters/registry.py')
          text = registry.read_text(encoding='utf-8')
          text = text.replace(
              'from . import gitleaks, nuclei, opengrep, osv, package_audit, playwright, semgrep, trivy, zap',
              'from . import bandit, gitleaks, nuclei, opengrep, osv, package_audit, playwright, semgrep, trivy, zap',
          )
          needle = '    "opengrep": opengrep.parse,\n'
          if '"bandit": bandit.parse' not in text:
              text = text.replace(needle, needle + '    "bandit": bandit.parse,\n')
          registry.write_text(text, encoding='utf-8')

          usage = Path('adapters/USAGE.md')
          text = usage.read_text(encoding='utf-8')
          needle = 'python -m adapters.cli opengrep opengrep.json --pretty\n'
          if 'adapters.cli bandit' not in text:
              text = text.replace(needle, needle + 'python -m adapters.cli bandit bandit.json --pretty\n')
          note = 'Bandit JSON keeps `issue_severity` and `issue_confidence` only as untrusted `tool_signal` metadata. Its `code` source-snippet field is deliberately omitted from normalized evidence because source snippets can contain credentials or other sensitive literals.\n\n'
          anchor = 'Opengrep intentionally accepts Semgrep-compatible rules and JSON result shapes'
          if note.strip() not in text:
              text = text.replace(anchor, note + anchor)
          usage.write_text(text, encoding='utf-8')

          tests = Path('adapters/tests/test_adapters.py')
          text = tests.read_text(encoding='utf-8')
          needle = '        ("opengrep", "semgrep.json", "opengrep"),\n'
          if '("bandit", "bandit.json", "bandit")' not in text:
              text = text.replace(needle, needle + '        ("bandit", "bandit.json", "bandit"),\n')
          old_set = '{"semgrep", "opengrep", "sarif", "codeql", "osv", "trivy", "gitleaks", "npm-audit", "pnpm-audit", "playwright", "zap", "nuclei"}'
          new_set = '{"semgrep", "opengrep", "bandit", "sarif", "codeql", "osv", "trivy", "gitleaks", "npm-audit", "pnpm-audit", "playwright", "zap", "nuclei"}'
          text = text.replace(old_set, new_set)
          high_anchor = '            ("osv", "osv.json"),\n'
          if '("bandit", "bandit.json")' not in text:
              text = text.replace(high_anchor, '            ("bandit", "bandit.json"),\n' + high_anchor)
          secret_anchor = '            ("trivy", "trivy.json", "TRIVY_FIXTURE_SECRET_123"),\n'
          if 'BANDIT_FIXTURE_SECRET_321' not in text:
              text = text.replace(secret_anchor, '            ("bandit", "bandit.json", "BANDIT_FIXTURE_SECRET_321"),\n' + secret_anchor)
          marker = '    def test_high_and_critical_tool_labels_never_promote_assessment(self) -> None:\n'
          dedicated = '''    def test_bandit_keeps_tool_judgement_untrusted_and_omits_code(self) -> None:\n        record = self._records("bandit", "bandit.json")[0]\n        self.assertEqual(record["rule_id"], "B602")\n        self.assertEqual(record["tool_signal"]["issue_severity"], "HIGH")\n        self.assertEqual(record["tool_signal"]["issue_confidence"], "HIGH")\n        self.assertIs(record["tool_signal"]["trusted_for_assessment"], False)\n        self.assertEqual(record["severity"], "UNASSESSED")\n        self.assertEqual(record["assessment"], "UNASSESSED")\n        self.assertEqual(record["verification"], "UNASSESSED")\n        self.assertEqual(record["properties"]["issue_cwe"]["id"], 78)\n        self.assertIs(record["properties"]["source_snippet_omitted"], True)\n        self.assertIs(record["properties"]["redacted"], True)\n        self.assertNotIn("code", record["properties"])\n        self.assertNotIn("BANDIT_FIXTURE_SECRET_321", json.dumps(record, sort_keys=True))\n\n'''
          if 'test_bandit_keeps_tool_judgement_untrusted_and_omits_code' not in text:
              text = text.replace(marker, dedicated + marker)
          malformed = '        with self.assertRaises(AdapterError):\n            parse("sarif", b"[]")\n'
          malformed_new = malformed + '        with self.assertRaises(AdapterError):\n            parse("bandit", b"{}")\n'
          if 'parse("bandit", b"{}")' not in text:
              text = text.replace(malformed, malformed_new)
          tests.write_text(text, encoding='utf-8')
      - name: Sync portable bundle and public counts
        run: |
          python scripts/sync_portable_skill.py
          python scripts/sync_doc_counts.py
      - name: Validate adapter contract and repository invariants
        run: |
          python -m unittest discover -s adapters/tests -v
          python scripts/validate_skill.py
          python scripts/check_doc_consistency.py
          python scripts/check_local_links.py
          python scripts/check_no_secrets.py
      - name: Commit integrated adapter
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: integrate Bandit as untrusted candidate evidence'
          git push origin HEAD:feat/bandit-adapter
