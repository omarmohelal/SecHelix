name: Sync PR47 documentation counts

on:
  push:
    branches:
      - feat/v4-opengrep-interoperability
    paths:
      - adapters/USAGE.md
      - .github/workflows/sync-doc-counts-pr47.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - name: Sync documented counts from the tree
        run: python scripts/sync_doc_counts.py

      - name: Commit only generated documentation drift
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Documentation counts already match the tree.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'docs: sync adapter count after Opengrep'
          git push origin HEAD:feat/v4-opengrep-interoperability
