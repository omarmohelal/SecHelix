name: Verify security runtime

on:
  push:
    branches: [main]
    paths:
      - 'containers/security-runtime/**'
      - 'sechelix_runner/pentest/runtime_manifest.py'
      - 'tests/runner/test_security_runtime.py'
      - 'tests/test_security_runtime_sbom.py'
      - 'scripts/generate_security_runtime_sbom.py'
      - '.github/workflows/security-runtime.yml'
  pull_request:
    paths:
      - 'containers/security-runtime/**'
      - 'sechelix_runner/pentest/runtime_manifest.py'
      - 'tests/runner/test_security_runtime.py'
      - '.github/workflows/security-runtime.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate runtime lock and sandbox policy
        run: python -m unittest tests.runner.test_security_runtime -v

      - name: Build digest-pinned security runtime
        run: |
          docker build --pull --progress=plain             -t sechelix-security-runtime:test             containers/security-runtime

      - name: Smoke pinned tools without runtime network
        run: |
          docker run --rm             --network none             --read-only             --tmpfs /tmp:rw,noexec,nosuid,size=64m             --cap-drop ALL             --security-opt no-new-privileges             --user 10001:10001             -e HOME=/tmp/home             -e SEMGREP_SEND_METRICS=off             sechelix-security-runtime:test             sh -ec '
              mkdir -p "$HOME"
              test "$(semgrep --version | tail -n 1)" = "1.140.0"
              gitleaks version | grep -F "8.28.0"
              trivy --version | grep -F "Version: 0.74.0"
              pip-audit --version | grep -F "2.9.0"
              python -m pip check
            '

      - name: Generate security runtime SBOM evidence
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/security-runtime-evidence"
          mkdir -p "${evidence_dir}"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python scripts/generate_security_runtime_sbom.py \
              --output "${evidence_dir}/sechelix-security-runtime.cdx.json"
          sha256sum "${evidence_dir}/sechelix-security-runtime.cdx.json" \
            > "${evidence_dir}/sechelix-security-runtime.cdx.json.sha256"
          docker image inspect --format '{{.Id}}' sechelix-security-runtime:test \
            > "${evidence_dir}/local-image-id.txt"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            -e HOME=/tmp/home \
            sechelix-security-runtime:test \
            python -m pip freeze --all \
            | LC_ALL=C sort > "${evidence_dir}/installed-python.txt"

      - name: Validate security runtime SBOM
        run: python -m unittest tests.test_security_runtime_sbom -v

      - name: Upload security runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-runtime-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/security-runtime-evidence/
          if-no-files-found: error
          retention-days: 14
