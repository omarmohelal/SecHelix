name: Verify security runtime

on:
  push:
    branches: [main]
    paths:
      - 'containers/security-runtime/**'
      - 'sechelix_runner/pentest/runtime_manifest.py'
      - 'tests/runner/test_security_runtime.py'
      - 'tests/test_security_runtime_sbom.py'
      - 'scripts/generate_security_runtime_sbom.py'
      - '.github/workflows/security-runtime.yml'
  pull_request:
    paths:
      - 'containers/security-runtime/**'
      - 'sechelix_runner/pentest/runtime_manifest.py'
      - 'tests/runner/test_security_runtime.py'
      - 'tests/test_security_runtime_sbom.py'
      - 'scripts/generate_security_runtime_sbom.py'
      - '.github/workflows/security-runtime.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the verified runtime image to GHCR and attest the pushed digest'
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: security-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate runtime lock and sandbox policy
        run: python -m unittest tests.runner.test_security_runtime -v

      - name: Build digest-pinned security runtime
        run: |
          docker build --pull --progress=plain             -t sechelix-security-runtime:test             containers/security-runtime

      - name: Smoke pinned tools without runtime network
        run: |
          docker run --rm             --network none             --read-only             --tmpfs /tmp:rw,noexec,nosuid,size=64m             --cap-drop ALL             --security-opt no-new-privileges             --user 10001:10001             -e HOME=/tmp/home             -e SEMGREP_SEND_METRICS=off             sechelix-security-runtime:test             sh -ec '
              mkdir -p "$HOME"
              test "$(semgrep --version | tail -n 1)" = "1.140.0"
              gitleaks version | grep -F "8.28.0"
              trivy --version | grep -F "Version: 0.74.0"
              pip-audit --version | grep -F "2.9.0"
              python -m pip check
            '

      - name: Generate security runtime SBOM evidence
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/security-runtime-evidence"
          mkdir -p "${evidence_dir}"
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python scripts/generate_security_runtime_sbom.py \
              --output "${evidence_dir}/sechelix-security-runtime.cdx.json"
          sha256sum "${evidence_dir}/sechelix-security-runtime.cdx.json" \
            > "${evidence_dir}/sechelix-security-runtime.cdx.json.sha256"
          docker image inspect --format '{{.Id}}' sechelix-security-runtime:test \
            > "${evidence_dir}/local-image-id.txt"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user 10001:10001 \
            -e HOME=/tmp/home \
            sechelix-security-runtime:test \
            python -m pip freeze --all \
            | LC_ALL=C sort > "${evidence_dir}/installed-python.txt"

      - name: Validate security runtime SBOM
        run: python -m unittest tests.test_security_runtime_sbom -v

      - name: Upload security runtime evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-runtime-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/security-runtime-evidence/
          if-no-files-found: error
          retention-days: 14

  publish-attested-image:
    needs: build-and-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate deterministic runtime SBOM
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)" \
            python scripts/generate_security_runtime_sbom.py \
              --output "${RUNNER_TEMP}/sechelix-security-runtime.cdx.json"

      - name: Build and publish immutable runtime image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: containers/security-runtime
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/sechelix-security-runtime:sha-${{ github.sha }}

      - name: Attest SLSA build provenance for pushed digest
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sechelix-security-runtime
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest runtime SBOM for pushed digest
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/sechelix-security-runtime
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sechelix-security-runtime.cdx.json
          push-to-registry: true
