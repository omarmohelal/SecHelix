name: Publish runner to PyPI

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: 'Exact pyproject.toml version to publish (for example 0.1.1)'
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - runner-release.json

permissions: {}

concurrency:
  group: pypi-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Refuse version or release-trigger mismatch
        env:
          CONFIRM_VERSION: ${{ inputs.confirm_version }}
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
        shell: python
        run: |
          import json
          import os
          import re
          from pathlib import Path

          if os.environ['GIT_REF'] != 'refs/heads/main':
              raise SystemExit(f"refusing publish outside main: {os.environ['GIT_REF']}")

          text = Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit('pyproject.toml does not declare a version')
          actual = match.group(1)

          init_text = Path('sechelix_runner/__init__.py').read_text(encoding='utf-8')
          runner_match = re.search(r'^RUNNER_VERSION\s*=\s*"([^"]+)"', init_text, re.M)
          if not runner_match or runner_match.group(1) != actual:
              raise SystemExit('sechelix_runner.RUNNER_VERSION does not match pyproject.toml')

          if os.environ['EVENT_NAME'] == 'workflow_dispatch':
              expected = os.environ.get('CONFIRM_VERSION', '').strip()
          else:
              marker = json.loads(Path('runner-release.json').read_text(encoding='utf-8'))
              expected = str(marker.get('version', '')).strip()
              if marker.get('publish') is not True:
                  raise SystemExit('runner-release.json must set publish=true')

          if actual != expected:
              raise SystemExit(f'refusing publish: requested {expected!r}, package is {actual!r}')
          if not re.fullmatch(r'\d+\.\d+\.\d+(?:[ab]\d+|rc\d+)?', actual):
              raise SystemExit(f'refusing unsupported package version: {actual!r}')
          print(f'Publishing candidate version: {actual}')

      - name: Run runner/package tests
        run: python -m unittest discover -s tests/runner -p 'test_*.py' -v

      - name: Install isolated build frontend
        run: python -m pip install --disable-pip-version-check 'build==1.3.0'

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify wheel installs and CLI starts
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/sechelix-wheel-check
          /tmp/sechelix-wheel-check/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/sechelix-wheel-check/bin/sechelix --help >/dev/null
          /tmp/sechelix-wheel-check/bin/sechelix doctor --json >/tmp/sechelix-doctor.json
          /tmp/sechelix-wheel-check/bin/python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/sechelix-doctor.json').read_text(encoding='utf-8'))
          if not data.get('core_contracts'):
              raise SystemExit('built wheel is missing its core contracts')
          PY

      - name: Record distribution hashes
        run: sha256sum dist/* | tee dist/SHA256SUMS

      - name: Upload distributions for isolated publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/sechelix/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Remove non-distribution checksum file before upload
        run: rm -f dist/SHA256SUMS

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
