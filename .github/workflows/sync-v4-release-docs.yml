name: Sync V4 release docs

on:
  push:
    branches:
      - release/v4.0.0-alpha.1
    paths:
      - scripts/_release_v4_patch.py

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Synchronize release documentation
        run: python scripts/_release_v4_patch.py
      - name: Show remaining previous-version references
        run: grep -R "3.4.0-alpha.2" -n --exclude-dir=.git . || true
      - name: Commit synchronized documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md ROADMAP.md CHANGELOG.md docs/packaging/RELEASE.md
          git commit -m 'release: synchronize V4 public documentation'
          git push origin HEAD:release/v4.0.0-alpha.1
