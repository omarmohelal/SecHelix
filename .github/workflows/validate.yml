name: Validate SecHelix

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate structured catalog
        run: python scripts/validate_catalog.py
      - name: Validate canonical skill and adapters
        run: python scripts/validate_skill.py
      - name: Validate community extension registry
        run: python scripts/validate_extensions.py
      - name: Validate canonical skill basics
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('SKILL.md')
          text = p.read_text(encoding='utf-8')
          assert text.startswith('---\n'), 'SKILL.md must start with YAML frontmatter'
          front = text.split('---', 2)[1]
          name = re.search(r'^name:\s*(.+)$', front, re.M)
          desc = re.search(r'^description:\s*(.+)$', front, re.M)
          assert name and name.group(1).strip() == 'sechelix'
          assert desc and 0 < len(desc.group(1).strip()) <= 1024
          assert len(text.splitlines()) < 500, 'Keep SKILL.md under 500 lines'
          print('OK: canonical skill frontmatter and size')
      - name: Ensure adapter mirrors exist
        shell: python
        run: |
          from pathlib import Path
          required = [
            'skills/sechelix/SKILL.md',
            '.claude/skills/sechelix/SKILL.md',
            '.codex/skills/sechelix/SKILL.md',
            '.agents/skills/sechelix/SKILL.md',
            '.github/skills/sechelix/SKILL.md',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f'missing adapters: {missing}'
          print('OK: adapter mirrors present')
      - name: Public site boundary and Pages handoff sanity
        shell: python
        run: |
          import tempfile
          from pathlib import Path
          from scripts.build_pages_handoff import DEFAULT_ORIGIN, build

          assert not Path('site').exists(), 'public authoring source must not be tracked'
          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory)
              build(output, DEFAULT_ORIGIN)
              assert (output / 'index.html').is_file()
              assert (output / 'support.html').is_file()
              assert (output / 'support' / 'index.html').is_file()
              assert DEFAULT_ORIGIN in (output / '404.html').read_text(encoding='utf-8')
          print('OK: no public site source; Pages handoff builds')
      - name: Check public/private source boundary
        run: python scripts/check_private_site_leakage.py
      - name: Check tracked files for high-confidence secrets
        run: python scripts/check_no_secrets.py
      - name: Check local documentation links
        run: python scripts/check_local_links.py
      - name: Check installation snippets
        run: python scripts/check_install_snippets.py
      - name: Run report, gate, eval, and QA tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
