name: Validate SecHelix

on:
  push:
    branches: [main]
  pull_request:

# Deny by default at the workflow level; every job re-grants only what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the commit-hygiene check walks back to a baseline ref,
          # and a shallow clone would make it silently pass with nothing to check.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Validate structured catalog
        run: python scripts/validate_catalog.py
      - name: Validate canonical skill and adapters
        run: python scripts/validate_skill.py
      - name: Validate community extension registry
        run: python scripts/validate_extensions.py
      - name: Validate knowledge engine
        run: python scripts/validate_knowledge.py
      - name: Validate gold check packs
        run: python scripts/validate_gold_packs.py
      - name: Validate canonical skill basics
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('skills/sechelix/SKILL.md')
          text = p.read_text(encoding='utf-8')
          assert text.startswith('---\n'), 'skills/sechelix/SKILL.md must start with YAML frontmatter'
          front = text.split('---', 2)[1]
          name = re.search(r'^name:\s*(.+)$', front, re.M)
          desc = re.search(r'^description:\s*(.+)$', front, re.M)
          assert name and name.group(1).strip() == 'sechelix'
          assert desc and 0 < len(desc.group(1).strip()) <= 1024
          assert len(text.splitlines()) < 500, 'Keep skills/sechelix/SKILL.md under 500 lines'
          print('OK: canonical skill frontmatter and size')
      - name: Ensure adapter mirrors exist
        shell: python
        run: |
          from pathlib import Path
          required = [
            'skills/sechelix/SKILL.md',
            '.claude/skills/sechelix/SKILL.md',
            '.agents/skills/sechelix/SKILL.md',
          ]
          missing = [p for p in required if not Path(p).is_file()]
          assert not missing, f'missing adapters: {missing}'
          print('OK: adapter mirrors present')
      - name: Public site boundary and Pages handoff sanity
        shell: python
        run: |
          import tempfile
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd()))
          from scripts.build_pages_handoff import DEFAULT_ORIGIN, build

          assert not Path('site').exists(), 'public authoring source must not be tracked'
          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory)
              build(output, DEFAULT_ORIGIN)
              assert (output / 'index.html').is_file()
              assert (output / 'support.html').is_file()
              assert (output / 'support' / 'index.html').is_file()
              assert DEFAULT_ORIGIN in (output / '404.html').read_text(encoding='utf-8')
          print('OK: no public site source; Pages handoff builds')
      - name: Check public/private source boundary
        run: python scripts/check_private_site_leakage.py
      - name: Check tracked files for high-confidence secrets
        run: python scripts/check_no_secrets.py
      - name: Check local documentation links
        run: python scripts/check_local_links.py
      - name: Check documented counts against the tree
        run: python scripts/check_doc_consistency.py
      - name: Check public commit hygiene
        run: python scripts/check_commit_hygiene.py
      - name: Check installation snippets
        run: python scripts/check_install_snippets.py
      - name: Run report, gate, eval, and QA tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run adapter and agent-profile tests
        run: python -m unittest discover -s adapters/tests -p 'test_*.py' -t . -v
      - name: Generate SBOM (smoke test)
        run: python scripts/generate_sbom.py --output "${RUNNER_TEMP}/sbom.cdx.json" --quiet
      - name: Portable skill bundle drift check
        run: |
          python scripts/sync_portable_skill.py
          if [ -n "$(git status --porcelain skills/)" ]; then
            echo "::error::skills/ portable bundle is stale. Run 'python scripts/sync_portable_skill.py' and commit the result."
            git status --porcelain skills/
            git --no-pager diff -- skills/
            exit 1
          fi
          echo "OK: portable skill bundle is in sync with canonical sources"
