name: Harden PR50 local proof transport

on:
  push:
    branches:
      - feat/v4-runtime-proof-execution
    paths:
      - .github/workflows/fix-proof-pr50-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply hardening patch
        run: python scripts/_fix_pr50_local.py
      - name: Run focused tests
        run: |
          python -m unittest discover -s tests/runner -p 'test_optionality.py' -v
          python -m unittest discover -s tests/runner -p 'test_proof_exec.py' -v
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sechelix_runner/proof_exec.py tests/runner/test_optionality.py tests/runner/test_proof_exec.py
          git commit -m 'fix: constrain proof transport to literal loopback'
          git push origin HEAD:feat/v4-runtime-proof-execution
