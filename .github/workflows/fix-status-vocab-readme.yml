name: Repair status vocabulary README edit

on:
  push:
    branches:
      - docs/status-vocabulary
    paths:
      - .github/workflows/fix-status-vocab-readme.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Rebuild README from main plus one documentation link
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          text = subprocess.check_output(['git', 'show', 'origin/main:README.md'], text=True)
          needle = '- [Repository map](docs/reference/repository-map.md) — what lives where\n'
          addition = needle + '- [Status vocabulary](docs/reference/status-vocabulary.md) — what `UNKNOWN`, `BLOCKED`, `VERIFIED`, `NOT_MEASURED`, and other SecHelix states actually assert\n'
          if needle not in text:
              raise SystemExit('README documentation insertion point not found')
          Path('README.md').write_text(text.replace(needle, addition, 1), encoding='utf-8')
      - name: Commit repaired README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: link status vocabulary reference'
          git push origin HEAD:docs/status-vocabulary
