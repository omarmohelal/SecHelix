name: Bug report
description: Report a SecHelix skill, adapter, docs, or tooling defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, private customer data, or live exploit credentials."
  - type: input
    id: version
    attributes:
      label: SecHelix version / commit
      placeholder: v2.x or commit SHA
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Claude Code
        - OpenAI Codex
        - Z.AI / GLM via coding host
        - Cursor
        - GitHub Copilot
        - Other
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: repro
    attributes:
      label: Safe reproduction
      description: Use a local/staging fixture when possible.
