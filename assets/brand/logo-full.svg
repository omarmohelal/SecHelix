<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 72" width="340" height="72" role="img" aria-label="SecHelix">
  <title>SecHelix</title>
  <desc>The SecHelix mark: a cyan claim strand and a violet verification strand crossing, with the wordmark.</desc>

  <!-- Helix mark: the claim strand and the independent verification strand. -->
  <g transform="translate(14 12) scale(1.85)">
    <path d="M 5 2 C 17 6, 17 20, 5 24" fill="none" stroke="#62d9ff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 19 2 C 7 6, 7 20, 19 24" fill="none" stroke="#9b8cff" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8.6" y1="7" x2="15.4" y2="7" stroke="#dbe6ef" stroke-opacity="0.6" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="7.6" y1="13" x2="16.4" y2="13" stroke="#dbe6ef" stroke-opacity="0.6" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="8.6" y1="19" x2="15.4" y2="19" stroke="#dbe6ef" stroke-opacity="0.6" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <text x="76" y="46"
        font-family="Instrument Sans, Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="34" font-weight="680" letter-spacing="-0.7" fill="#eef5fa">SecHelix</text>
</svg>
